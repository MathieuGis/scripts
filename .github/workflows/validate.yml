name: Validate repository
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  structure-and-bash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 tests/validate-repository.py
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Parse active scripts with Windows PowerShell
        shell: powershell
        run: ./tests/Test-PowerShellSyntax.ps1
      - name: Test in-memory launcher with harmless fixtures
        shell: powershell
        run: ./tests/Test-Toolkit.ps1
